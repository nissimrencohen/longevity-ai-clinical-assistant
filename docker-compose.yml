# Longevity clinical assistant - the three services that were previously host
# processes.
#
#     docker compose up -d
#
# Network isolation is the point. The services address each other by SERVICE
# NAME on a private bridge network (backend:8001, mlflow:5001, mcp:9000), so
# nothing they say to each other touches a host port. Two host processes on this
# machine were killed by their launching shell, and an unrelated QuestDB
# container silently took port 9000; neither failure mode can reach this stack.
#
# Exactly ONE host port is published, and only because the eval harness and the
# LibreChat container are outside this network:
#
#     ${MCP_PUBLISH_PORT:-9100} -> mcp:9000
#
# Even that is avoidable: attach LibreChat to the `longevity-net` network (see
# librechat/docker-compose.network.yml) and it reaches http://mcp:9000/mcp with
# no published port at all. Set MCP_PUBLISH_PORT to move it, or use the
# `no-publish` profile note in COMPOSE.md to drop it entirely.

name: longevity

x-service-defaults: &defaults
  build:
    context: .
    dockerfile: Dockerfile
  image: longevity-clinical:latest
  restart: always
  networks: [longevity]
  environment:
    # Service-name addressing. These override the repo .env, which points at
    # 127.0.0.1 for host mode.
    BACKEND_URL: http://backend:8001
    MLFLOW_URL: http://mlflow:5001/invocations
    MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-dev-longevity-token-change-me}
    POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@postgres:5432/${POSTGRES_DB:-clinic}
    REDIS_URL: redis://redis:6379/0
    # Tracing follows the observability profile; off unless asked for.
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://phoenix:6006/v1/traces}

services:
  # The clinical database. Postgres rather than SQLite for two concrete reasons,
  # not for its own sake: the risk endpoint WRITES on every request (SQLite takes
  # a database-wide lock, so two doctors asking about two different patients
  # serialise), and the dedupe rule needs a unique index to be atomic instead of
  # a read-then-write race.
  postgres:
    image: postgres:16-alpine
    container_name: longevity-postgres
    restart: always
    networks: [longevity]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Risk cache. Keyed on the feature payload hash, so a hit is provably the same
  # computation rather than merely the same patient.
  redis:
    image: redis:7-alpine
    container_name: longevity-redis
    restart: always
    networks: [longevity]
    # Bounded memory with LRU eviction: a cache that can exhaust the host is a
    # liability, and every entry here is recomputable.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: `alembic upgrade head` then load the shipped SQLite fixture.
  # Idempotent, and the backend waits for it to finish successfully, so the API
  # can never come up against an empty or half-migrated database.
  seed:
    <<: *defaults
    container_name: longevity-seed
    restart: "no"
    command: ["python", "scripts/seed_postgres.py"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
  # The five risk models behind one pyfunc router that returns probabilities
  # rather than class labels. The artefact is baked into the image at build time
  # (see Dockerfile), so models/ is deliberately NOT mounted.
  mlflow:
    <<: *defaults
    container_name: longevity-mlflow
    command:
      - mlflow
      - models
      - serve
      - --model-uri
      - models/mlflow_risk_router
      - --host
      - 0.0.0.0
      - --port
      - "5001"
      - --env-manager
      - local
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "http://127.0.0.1:5001/ping", "200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    <<: *defaults
    container_name: longevity-backend
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      BACKEND_URL: http://backend:8001
      MLFLOW_URL: http://mlflow:5001/invocations
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-dev-longevity-token-change-me}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic}@postgres:5432/${POSTGRES_DB:-clinic}
      REDIS_URL: redis://redis:6379/0
      # The containerised stack is the Postgres + Redis deployment. Host mode
      # keeps the SQLite/no-cache defaults from the repo .env, so both paths stay
      # exercised and a fresh clone still runs with no services at all.
      DB_BACKEND: ${DB_BACKEND:-postgres}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
    volumes:
      # Read-only: with Postgres as the live database the SQLite file is a seed
      # fixture, not a write target. Mounting it ro makes that explicit and stops
      # a misconfigured backend from quietly writing to the wrong store.
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "http://127.0.0.1:8001/health", "200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mcp:
    <<: *defaults
    container_name: longevity-mcp
    command:
      - python
      - mcp-server/server.py
    environment:
      BACKEND_URL: http://backend:8001
      MLFLOW_URL: http://mlflow:5001/invocations
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-dev-longevity-token-change-me}
      MCP_HOST: 0.0.0.0
      # Inside the network the natural port is fine; the host mapping below is
      # what avoids collisions with whatever else is running on this machine.
      MCP_PORT: "9000"
    ports:
      - "${MCP_PUBLISH_PORT:-9100}:9000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 401 is the healthy answer - see scripts/healthcheck.py.
      test: ["CMD", "python", "scripts/healthcheck.py", "http://127.0.0.1:9000/mcp", "401"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Clinical safety guard: an OpenAI-compatible proxy in front of OpenRouter.
  #
  # This is the ONLY place in the stack that sees the assistant's prose. MCP
  # carries tool calls; the model's answer otherwise goes straight from
  # OpenRouter to the clinician. Point LibreChat's endpoint baseURL here and
  # every token the clinician sees has passed through policy.
  #
  # It holds no patient data and needs nothing else in the stack, so it is
  # published for LibreChat and the eval harness to reach.
  guard:
    <<: *defaults
    container_name: longevity-guard
    command:
      - uvicorn
      - guard.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      GUARD_UPSTREAM_URL: ${GUARD_UPSTREAM_URL:-https://openrouter.ai/api/v1}
      # Optional: only used when a caller sends no Authorization header of its
      # own. LibreChat and the harness both send their own key.
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
    ports:
      - "${GUARD_PUBLISH_PORT:-9200}:8080"
    depends_on: []
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "http://127.0.0.1:8080/health", "200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Trace backend. Opt-in:  docker compose --profile observability up -d
  #
  # A single container, OTel-native, so a reviewer gets a working trace view with
  # no extra setup. Self-hosted Langfuse would be the better production answer
  # (prompt versioning, datasets, cost dashboards) but needs Postgres +
  # ClickHouse + object storage — four more containers on a stack that already
  # runs seven. OpenTelemetry is the wire format either way, so swapping backends
  # touches this file and nothing else.
  #
  # Spans are scrubbed before they leave the app (backend/app/core/telemetry.py):
  # allowlisted attributes only, no query strings, pseudonymised patient ids.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: longevity-phoenix
    profiles: ["observability"]
    restart: always
    networks: [longevity]
    ports:
      - "${PHOENIX_PUBLISH_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

networks:
  longevity:
    name: longevity-net

volumes:
  postgres-data:
  phoenix-data:
