# LibreChat configuration for the Longevity clinical assistant.
#
# Pinned LibreChat release: v0.8.7 (2026-06-24)
# Config schema version: 1.3.13 — matches that release.
#
# INSTALL: copy this file into the root of your LibreChat checkout (next to
# deploy-compose.yml), which mounts ./librechat.yaml into the api container:
#
#     cp <this-repo>/librechat/librechat.yaml <librechat-checkout>/librechat.yaml
#
# Two variables are interpolated from LibreChat's OWN .env at container start:
#   OPENROUTER_KEY    — your OpenRouter API key
#   MCP_BEARER_TOKEN  — must equal this repo's .env value, or the MCP server 401s
# See librechat/env.notes.md.

version: 1.3.13
cache: true

# --------------------------------------------------------------------------
# SSRF allowlist — the #1 reason a "connected" MCP server never fires.
#
# LibreChat blocks requests to private address space by default. Our MCP server
# runs on the host while LibreChat runs in a container, so the connection is
# host.docker.internal -> private IP, which is exactly what that block catches.
#
# `allowedAddresses` is the narrow exemption: it takes host:port pairs only
# (never URLs, bare hosts, or CIDR ranges) and re-permits that one private
# service while leaving default SSRF protection intact everywhere else. That is
# preferable to `allowedDomains`, which flips the whole system into strict
# whitelist mode and would then block every public destination not also listed.
#
# PORT 9100, NOT 9000. GUIDE.md pins the MCP server to 9000, but that port is
# claimed on this machine by an unrelated QuestDB container
# (vix_questdb publishes 0.0.0.0:9000->9000/tcp) which Docker restarts
# automatically. The symptom is nasty: the port is occupied, so a naive
# "is something listening?" check passes, but LibreChat talks to QuestDB and
# reports "Failed to initialize MCP server". Moving our server is the
# non-invasive fix - the port map exists to dodge collisions, and this is one.
# Keep this in sync with MCP_PORT in the repo-root .env.
# --------------------------------------------------------------------------
mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:9100'

# --------------------------------------------------------------------------
# The MCP server. Three things must all be right or no tool ever fires:
#   1. host.docker.internal — NOT localhost. Inside the container, localhost is
#      the container itself, not your machine.
#   2. NO trailing slash on /mcp. This is inverted from GUIDE.md's advice, which
#      describes FastMCP 2.x. Under FastMCP 3.x the canonical path is /mcp and
#      /mcp/ answers 307 -> /mcp. LibreChat's MCP client does not replay the
#      Authorization header across that redirect, so it sees an unauthenticated
#      response, reports "OAuth Required: true", and registers 0 tools — while
#      still logging the server as successfully initialized. Verified against
#      fastmcp 3.4.4 by probing both paths from inside the api container:
#      /mcp/ -> 307, /mcp -> 200 with an mcp-session-id.
#   3. The server must bind 0.0.0.0 (MCP_HOST in this repo's .env), or it is
#      unreachable from outside its own process.
# --------------------------------------------------------------------------
mcpServers:
  longevity-clinical:
    type: streamable-http

    # Host-port path (default, verified end to end): LibreChat reaches the MCP
    # server through the one port the stack publishes.
    url: http://host.docker.internal:9100/mcp

    # Container-network path (stronger): if you start LibreChat with
    # librechat/docker-compose.network.yml, its api container joins this
    # project's private network and can address the server by name. No published
    # port is involved, so nothing on the host can collide with it - and the
    # mcpSettings.allowedAddresses entry above becomes unnecessary.
    #
    # url: http://mcp:9000/mcp
    headers:
      Authorization: 'Bearer ${MCP_BEARER_TOKEN}'

    # REQUIRED with a statically bearer-authed MCP server, and non-obvious.
    #
    # At startup LibreChat runs detectOAuthRequirement() against the server URL.
    # That probe deliberately sends NO configured headers, so FastMCP answers 401
    # with a `WWW-Authenticate: Bearer` challenge. LibreChat reads the challenge as
    # "this server speaks OAuth", sets requiresOAuth=true, and from then on treats
    # the server as OAuth-gated — so it never sends the static Authorization header
    # above, discovers 0 tools, and still logs the server as initialized.
    #
    # Setting requiresOAuth explicitly short-circuits that detection
    # (MCPServerInspector.detectOAuth returns early when it is already set), so the
    # static header is used as intended.
    #
    # Symptom if you remove this: "Initialized with 1 configured server and 0 tools"
    # plus "OAuth Required: true", while the MCP server's own log shows a HEAD and
    # a POST both answered 401.
    requiresOAuth: false

    # get_current_risks fans out to five models; 60s is generous but bounded.
    timeout: 60000

endpoints:
  agents:
    # The built-in agent is what calls the MCP tools.
    capabilities: ['tools', 'actions']
    recursionLimit: 25

  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        # These IDs were verified against the live OpenRouter models API and all
        # advertise `tools` support. Picking a model WITHOUT tool support is
        # GUIDE trap #4: the agent answers fluently and never calls your tools,
        # which looks like an MCP failure but is not.
        default:
          - 'anthropic/claude-haiku-4.5'
          - 'anthropic/claude-sonnet-4.5'
          - 'openai/gpt-4o-mini'
          - 'openai/gpt-4.1-mini'
          - 'google/gemini-2.5-flash'
        fetch: true
      titleConvo: true
      titleModel: 'openai/gpt-4o-mini'
      # OpenRouter models use a variety of stop tokens; passing `stop` through
      # causes provider-side errors.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
